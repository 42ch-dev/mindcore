[package]
name = "mindcore-spi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[features]
# Test-only ranking probe (`workflows::scored_bits_for_test`). Only
# `mindcore-spoke`'s [dev-dependencies] enable it; it must never be enabled by a
# production dependency edge.
test-scoring = []

[dependencies]
spoke-schemas.workspace = true
spoke-operations.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# Executor-independent timer: the deadline must bound provider futures without
# this crate depending on a runtime.
futures-timer = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
