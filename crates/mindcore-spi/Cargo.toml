[package]
name = "mindcore-spi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MIND ladder contract crate: capability and workflow seams over the published SPOKE DTOs"
include = ["src/**/*.rs", "Cargo.toml", "LICENSE"]

[dependencies]
mindcore-base = { path = "../mindcore-base", version = "0.1.0" }
spoke-schemas.workspace = true
spoke-operations.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# Executor-independent timer: the deadline must bound provider futures without
# this crate depending on a runtime.
futures-timer = "3"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
