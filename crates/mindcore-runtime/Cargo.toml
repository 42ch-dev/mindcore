[package]
name = "mindcore-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
async-trait.workspace = true
chrono.workspace = true
mindcore-base = { path = "../mindcore-base" }
mindcore-sqlite = { path = "../mindcore-sqlite" }
mindcore-spi = { path = "../mindcore-spi" }
mindcore-spoke = { path = "../mindcore-spoke" }
serde.workspace = true
serde_json.workspace = true
spoke-connect = { workspace = true, features = ["remote-adapter"] }
spoke-operations.workspace = true
spoke-schemas.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
ed25519-dalek = "3"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
