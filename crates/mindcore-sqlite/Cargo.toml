[package]
name = "mindcore-sqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "SQLite storage adapter for the MIND core: records, knowledge, cognition and vectors"
include = [
    "src/**/*.rs",
    "migrations/**/*.sql",
    # The crate builds with compile-time `sqlx::query!` macros, so the package
    # must carry the offline query cache or a consumer's build fails for lack of
    # `DATABASE_URL`. `.sqlx` is a symlink to the workspace cache so CI's single
    # freshness check in one place still governs it.
    ".sqlx/*.json",
    "Cargo.toml",
    "LICENSE",
]

[dependencies]
mindcore-base = { path = "../mindcore-base", version = "0.1.0-alpha.1" }
spoke-schemas.workspace = true
spoke-operations.workspace = true
serde_json.workspace = true
chrono.workspace = true
async-trait.workspace = true
thiserror.workspace = true
sqlx.workspace = true
tokio.workspace = true

[dev-dependencies]
ed25519-dalek = "3"
spoke-connect = { workspace = true, features = ["remote-adapter"] }
tempfile = "3.27.0"
# settle-parity Task 1: the embed_parity harness drives `MemoryAdapter` +
# `SqliteMemoryRepository` on a caller-held transaction. Test-only edge.
mindcore-spoke = { path = "../mindcore-spoke" }
# Knowledge adoption regression: the SPI helper is exercised against this crate's real ports.
mindcore-spi = { path = "../mindcore-spi" }
# I-000060: `spaces_list_query_count` sets `log_statements` (a `log::LevelFilter`)
# and counts the driver's `sqlx::query` tracing events. Both crates are already in
# the graph through sqlx.
log = "0.4"
tracing = "0.1"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
