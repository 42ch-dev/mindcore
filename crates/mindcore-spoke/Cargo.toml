[package]
name = "mindcore-spoke"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
mindcore-base = { path = "../mindcore-base" }
mindcore-sqlite = { path = "../mindcore-sqlite" }
mindcore-spi = { path = "../mindcore-spi" }
async-trait.workspace = true
spoke-schemas.workspace = true
spoke-operations.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
sqlx.workspace = true

[dev-dependencies]
# Test-only scorer probe: never enable `test-scoring` from a production dependency.
mindcore-spi = { path = "../mindcore-spi", features = ["test-scoring"] }
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
