[package]
name = "mindcore-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The sidecar daemon: one store file, one Unix socket, the SPOKE-peer delivery form"
publish = false

[lib]
name = "mindcore_daemon"
path = "src/lib.rs"

[[bin]]
name = "mindcore-daemon"
path = "src/main.rs"

[dependencies]
async-trait.workspace = true
# `shutdown(2)` on the socket's own descriptor: teardown must not queue behind a blocked writer.
libc = "0.2"
mindcore-base = { path = "../mindcore-base", version = "0.1.0" }
mindcore-runtime = { path = "../mindcore-runtime", version = "0.1.0" }
mindcore-sqlite = { path = "../mindcore-sqlite", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
spoke-connect = { workspace = true, features = ["remote-adapter"] }
spoke-operations.workspace = true
spoke-schemas.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net", "sync", "io-util", "time", "signal"] }
# `parse` + `serde` are all the daemon reads; no TOML is ever written.
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }

[dev-dependencies]
# The dialer's throwaway key in `tests/serve.rs`: the same crate the runtime's loopbacks use.
ed25519-dalek = "3"
tempfile = "3.27.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
