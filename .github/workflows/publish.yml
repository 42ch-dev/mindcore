name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish; empty reads [workspace.package] version from Cargo.toml
        required: false
        type: string
      dry_run:
        description: Pass --dry-run to every cargo publish
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Resolve version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          manifest="$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "mindcore-base") | .version')"
          version="$INPUT_VERSION"
          if [ -z "$version" ]; then
            version="$manifest"
          elif [ "$version" != "$manifest" ]; then
            echo "::error::input version $version does not match the Cargo.toml workspace version $manifest"
            exit 1
          fi
          echo "publishing version $version"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # Order follows the internal dependency edges: a crate's manifest pins the
          # registry version of the crate below it, so base must be resolvable before
          # spi or sqlite can even be packaged.
          dry_run=()
          if [ "$DRY_RUN" = "true" ]; then
            dry_run=(--dry-run)
          fi
          visible() {
            # The sparse index is what the next `cargo publish` resolves dependencies
            # against, so gate on it rather than on the API, which can answer first.
            case "$1" in
              ?) path="1/$1" ;;
              ??) path="2/$1" ;;
              ???) path="3/${1:0:1}/$1" ;;
              *) path="${1:0:2}/${1:2:2}/$1" ;;
            esac
            body="$(curl -fsS -H 'User-Agent: mindcore-publish-workflow (https://github.com/42ch-dev/mindcore)' \
              "https://index.crates.io/$path" 2>/dev/null)" || return 1
            grep -q "\"vers\":\"$VERSION\"" <<<"$body"
          }
          for crate in mindcore-base mindcore-spi mindcore-sqlite; do
            # A version cannot be uploaded twice, so a re-run after a partial failure
            # resumes instead of failing on the crate that already landed.
            if [ "$DRY_RUN" != "true" ] && visible "$crate"; then
              echo "$crate $VERSION is already published; skipping"
              continue
            fi
            cargo publish -p "$crate" --locked "${dry_run[@]}"
            if [ "$DRY_RUN" = "true" ]; then
              continue
            fi
            # crates.io exposes a version a few seconds after upload; cap the wait at
            # five minutes so a missed version fails the job instead of hanging.
            for attempt in $(seq 1 30); do
              if visible "$crate"; then
                echo "$crate $VERSION is visible on crates.io"
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "::error::$crate $VERSION did not appear on crates.io"
                exit 1
              fi
              echo "waiting for $crate $VERSION (attempt $attempt/30)"
              sleep 10
            done
          done
