name: New release

# Opens a version-bump PR. Merge it (keep the `release` label) to tag and create
# the GitHub Release via the Release workflow.
# Requires: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests".
on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          SemVer greater than the current workspace version. No build metadata
          (`+...`). Empty = the default bump: next patch of a stable version, or
          the core of a prerelease (0.2.0-rc.1 -> 0.2.0).
        required: false
        type: string
        default: ""

# One group for every dispatch: an empty and an explicit input can compute the
# same `release/<version>` branch, so they must never run side by side.
concurrency:
  group: new-release
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  # Label bootstrap: `gh label create release` on the first release.
  issues: write

jobs:
  open-pr:
    name: open-release-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: git-cliff@2

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(node tooling/release/next-version.mjs ${INPUT_VERSION:+"$INPUT_VERSION"})"
          TAG="v${VERSION}"
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists; choose a higher version."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${TAG}"

      - name: Ensure release label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create release --description "Release bump PR - merge to tag and release" --color BFD4F2 2>/dev/null || true

      - name: Ensure release label on an open pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"

          # API form: `gh pr list --head` silently misses the branch on a rerun.
          # Owner-qualified head so a fork's branch of the same name never matches.
          EXISTING="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/pulls" \
            -f state=open -f base=main -f head="${GITHUB_REPOSITORY_OWNER}:${BRANCH}" \
            --jq '.[0].number // empty')"
          if [ -z "$EXISTING" ]; then
            exit 0
          fi

          # Review decides what the branch carries, and it may have reworded the
          # title, the body or even the version: touching none of them is what keeps
          # a re-dispatch from discarding review edits. Only the label matters — the
          # Release workflow reads it to tag and publish on merge.
          gh pr edit "$EXISTING" --add-label release
          echo "PR #${EXISTING} already open; left its branch, title and body alone."
          echo "number=${EXISTING}" >> "$GITHUB_OUTPUT"

      - name: Create release branch and bump
        if: steps.pr.outputs.number == ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH" origin/main

          node tooling/release/bump-version.mjs "$VERSION"
          if git diff --quiet; then
            echo "::error::Version bump produced no changes."
            exit 1
          fi

          node tooling/release/render-changelog.mjs "$VERSION"

          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): bump version to ${VERSION}"
          # A dispatch whose PR was closed leaves the branch behind, so replace it;
          # learn the remote tip first or the lease has no expected value.
          git fetch origin "$BRANCH" 2>/dev/null || true
          git push --force-with-lease origin "$BRANCH"

      - name: Create pull request
        if: steps.pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BODY_FILE="${RUNNER_TEMP}/release-pr-body.md"
          {
            echo "## Release ${VERSION}"
            echo ""
            echo "Bumps the workspace version to \`${VERSION}\` and regenerates \`CHANGELOG.md\` with git-cliff."
            echo ""
            echo "Merging this PR (keep the \`release\` label) creates annotated tag \`v${VERSION}\` and the GitHub Release."
            echo ""
            echo "Generated by **New release** (\`workflow_dispatch\`)."
          } > "$BODY_FILE"

          gh pr create --base main --head "release/${VERSION}" \
            --title "chore(release): bump version to ${VERSION}" \
            --body-file "$BODY_FILE" --label release
