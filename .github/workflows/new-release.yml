name: New release

# Opens a version-bump PR. Merge it (keep the `release` label) to tag and create
# the GitHub Release via the Release workflow.
# Requires: Settings > Actions > General > "Allow GitHub Actions to create and
# approve pull requests".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer greater than the current workspace version. Empty = patch bump of the current version."
        required: false
        type: string
        default: ""

# One group for every dispatch: an empty and an explicit input can compute the
# same `release/<version>` branch, so they must never run side by side.
concurrency:
  group: new-release
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    name: open-release-pr
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: git-cliff@2

      - name: Resolve and validate version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="$(node tooling/release/next-version.mjs ${INPUT_VERSION:+"$INPUT_VERSION"})"
          TAG="v${VERSION}"
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists; choose a higher version."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${TAG}"

      - name: Create release branch and bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH" origin/main

          node tooling/release/bump-version.mjs "$VERSION"
          if git diff --quiet; then
            echo "::error::Version bump produced no changes."
            exit 1
          fi

          git-cliff --tag "v${VERSION}" -o CHANGELOG.md
          if ! grep -qF "## [${VERSION}]" CHANGELOG.md; then
            echo "::error::git-cliff produced no ## [${VERSION}] section (all commits filtered, or the tag landed on the previous release commit)."
            exit 1
          fi

          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -m "chore(release): bump version to ${VERSION}"
          # A re-dispatch must be able to replace its own branch, so learn the
          # remote tip first; otherwise the lease has no expected value.
          git fetch origin "$BRANCH" 2>/dev/null || true
          git push --force-with-lease origin "$BRANCH"

      - name: Ensure release label
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create release --description "Release bump PR - merge to tag and release" --color BFD4F2 2>/dev/null || true

      - name: Open or update pull request
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="release/${VERSION}"
          TITLE="chore(release): bump version to ${VERSION}"
          BODY_FILE="$(mktemp)"
          {
            echo "## Release ${VERSION}"
            echo ""
            echo "Bumps the workspace version to \`${VERSION}\` and regenerates \`CHANGELOG.md\` with git-cliff."
            echo ""
            echo "Merging this PR (keep the \`release\` label) creates annotated tag \`v${VERSION}\` and the GitHub Release."
            echo ""
            echo "Generated by **New release** (\`workflow_dispatch\`)."
          } > "$BODY_FILE"

          EXISTING="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "$TITLE" --body-file "$BODY_FILE" --add-label release
            echo "Updated PR #${EXISTING}"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" --title "$TITLE" --body-file "$BODY_FILE" --label release
