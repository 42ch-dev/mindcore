name: Release

# Gates the merged release-bump PR on its API diff, then tags it, creates the
# GitHub Release and, for a stable version, publishes the public crates to
# crates.io.
#
# Release notes are the `## [<version>]` section of the committed `CHANGELOG.md`,
# i.e. the curated notes the release PR carried. Commits merged after the
# dispatch are not reflected (tracked as I-000112).
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  semver-gate:
    name: semver-gate
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    # Read-only: `cargo semver-checks` builds dependencies, and this job must
    # not run their build scripts with a token that can write repository refs.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          echo "version=$(node tooling/release/next-version.mjs --current)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        with:
          toolchain: stable
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        with:
          tool: cargo-semver-checks

      # Before the tag exists: a rejected release must leave no tag behind, or
      # the next patch would diff against an API that never shipped. HEAD is not
      # a tag commit yet, so `--blocking` forces the API diff to apply; the
      # baseline is the newest released stable tag. `fetch-depth: 0` above
      # already carries every tag, so no fetch runs here: this checkout holds no
      # credential to fetch with.
      - name: SemVer policy check
        if: ${{ !contains(steps.version.outputs.version, '-') }}
        run: node tooling/semver/check.mjs --blocking
        env:
          SQLX_OFFLINE: "true"

      # The lock must already cover every migration in the tagged commit, for a
      # prerelease too: a prerelease is Git-only but still ships the migration
      # set, and its tag must not record an unlocked one.
      # --write-lock is a no-op when it does; when a migration landed after the
      # release PR opened, it writes the missing entry and the diff fails the
      # gate instead of tagging a migration the next check would not protect.
      - name: Migration lock is complete
        run: |
          node tooling/migrations/check.mjs --write-lock
          git diff --exit-code -- tooling/migrations/migrations.lock.json

      # A prerelease never uploads, so it claims no registry version and owes no
      # compatible API to one.
      - name: Skip SemVer policy check
        if: ${{ contains(steps.version.outputs.version, '-') }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: echo "::notice::${VERSION} is a prerelease and never uploads; the API diff gate is skipped."

  release:
    name: release
    needs: semver-gate
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.notes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      # Before any tag exists: a missing section must fail the run untouched.
      - name: Prepare release notes
        id: notes
        run: |
          set -euo pipefail
          VERSION="$(node tooling/release/next-version.mjs --current)"
          TAG="v${VERSION}"
          BODY_FILE="${RUNNER_TEMP}/release-body.md"
          if ! node tooling/release/extract-changelog-notes.mjs "${VERSION}" > "$BODY_FILE"; then
            echo "::error::No committed CHANGELOG.md section for ${VERSION}; nothing tagged."
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "body=${BODY_FILE}"
          } >> "$GITHUB_OUTPUT"

      - name: Tag the merge commit
        env:
          TAG: ${{ steps.notes.outputs.tag }}
          BODY_FILE: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force origin

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
              echo "::error::Tag ${TAG} exists but is not an annotated tag."
              exit 1
            fi
            # A rerun must tag the same commit; a stale tag means main moved on.
            TAGGED="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            if [ "$TAGGED" != "${{ github.event.pull_request.merge_commit_sha }}" ]; then
              echo "::error::Tag ${TAG} points at ${TAGGED}, not the merged commit ${{ github.event.pull_request.merge_commit_sha }}."
              exit 1
            fi
            echo "Tag ${TAG} already exists; continuing."
          else
            # Prepare release notes already failed on an empty body, so the
            # annotation is that same body. `--cleanup=verbatim` keeps the
            # Markdown headings the default cleanup would strip.
            git tag -a "$TAG" --cleanup=verbatim -F "$BODY_FILE" "${{ github.event.pull_request.merge_commit_sha }}"
            git push origin "refs/tags/${TAG}"
            echo "Created and pushed ${TAG}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          TAG: ${{ steps.notes.outputs.tag }}
          BODY_FILE: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          if [ ! -s "$BODY_FILE" ]; then
            echo "::error::Release body for ${TAG} is empty."
            exit 1
          fi

          # Any SemVer prerelease (`-...`) is a prerelease release.
          PRERELEASE=()
          case "$VERSION" in
            *-*) PRERELEASE=(--prerelease) ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; continuing."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$BODY_FILE" "${PRERELEASE[@]}"
          fi

  # The three crates publish in registry order — a manifest pins the registry
  # version of the crate below it — and each pair splits verification from the
  # credential-bearing upload.
  #
  # verify-*: `contents: read`, no `id-token`, credentials not persisted — the
  # `cargo publish --dry-run` verification build runs dependency build scripts,
  # and a process (not just its environment) must hold no credential it could
  # read or mint.
  #
  # publish-*: `id-token: write` for crates.io Trusted Publishing; the upload
  # runs `--no-verify`, so no dependency build script shares its job.
  #
  # The `needs` chain keeps the registry order: base before spi before sqlite.
  verify-base:
    name: verify-base
    needs: release
    # Any SemVer prerelease (`-...`) skips the upload: a registry version is
    # immutable, so a release candidate must not claim one.
    if: >
      needs.release.result == 'success' &&
      !contains(needs.release.outputs.version, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Verify mindcore-base
        run: ./tooling/release/verify-crate.sh mindcore-base

  publish-base:
    name: publish-base
    needs: [release, verify-base]
    if: >
      needs.release.result == 'success' &&
      !contains(needs.release.outputs.version, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      # crates.io Trusted Publishing: a short-lived token minted from the
      # workflow's OIDC identity; the action revokes it in a post step.
      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish mindcore-base
        run: ./tooling/release/publish-crate.sh mindcore-base
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  verify-spi:
    name: verify-spi
    needs: [release, publish-base]
    if: >
      needs.release.result == 'success' &&
      !contains(needs.release.outputs.version, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Verify mindcore-spi
        run: ./tooling/release/verify-crate.sh mindcore-spi

  publish-spi:
    name: publish-spi
    needs: [release, verify-spi]
    if: >
      needs.release.result == 'success' &&
      !contains(needs.release.outputs.version, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish mindcore-spi
        run: ./tooling/release/publish-crate.sh mindcore-spi
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  verify-sqlite:
    name: verify-sqlite
    needs: [release, publish-spi]
    if: >
      needs.release.result == 'success' &&
      !contains(needs.release.outputs.version, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Verify mindcore-sqlite
        run: ./tooling/release/verify-crate.sh mindcore-sqlite

  publish-sqlite:
    name: publish-sqlite
    needs: [release, verify-sqlite]
    if: >
      needs.release.result == 'success' &&
      !contains(needs.release.outputs.version, '-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable

      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish mindcore-sqlite
        run: ./tooling/release/publish-crate.sh mindcore-sqlite
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
