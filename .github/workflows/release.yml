name: Release

# Tags the merged release-bump PR and creates the GitHub Release.
# No crate ships to a registry: the release is a tag plus a GitHub Release.
on:
  pull_request:
    types: [closed]
    branches: [main]

concurrency:
  group: release-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: release
    if: >
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: git-cliff@2

      - name: Prepare release notes
        id: notes
        run: |
          set -euo pipefail
          # The merge commit's version, not the dispatch-time snapshot: git-cliff
          # reads the commits that actually landed, including late merges.
          VERSION="$(node tooling/release/next-version.mjs --current)"
          TAG="v${VERSION}"
          BODY_FILE="${RUNNER_TEMP}/release-body.md"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "body=${BODY_FILE}"
          } >> "$GITHUB_OUTPUT"

          # The note range runs from the previous release tag to HEAD.
          git fetch --tags --force origin
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            # A rerun has no commits left to render: reuse the annotation the
            # first run baked in, minus any signature appended to the tag object.
            git tag -l --format='%(contents)' "${TAG}" \
              | sed '/^-----BEGIN [A-Z ]*SIGNATURE-----/,$d' > "$BODY_FILE"
          else
            git-cliff --tag "${TAG}" -o "${RUNNER_TEMP}/release-notes.md"
            # extract-changelog-notes reports its own reason on stderr.
            node tooling/release/extract-changelog-notes.mjs "${VERSION}" "${RUNNER_TEMP}/release-notes.md" > "$BODY_FILE" || true
          fi
          if [ ! -s "$BODY_FILE" ]; then
            echo "::error::No release notes for ${TAG}; the release body would be empty."
            exit 1
          fi

      - name: Tag the merge commit
        env:
          TAG: ${{ steps.notes.outputs.tag }}
          BODY_FILE: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
              echo "::error::Tag ${TAG} exists but is not an annotated tag."
              exit 1
            fi
            # A rerun must tag the same commit; a stale tag means main moved on.
            TAGGED="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            if [ "$TAGGED" != "${{ github.event.pull_request.merge_commit_sha }}" ]; then
              echo "::error::Tag ${TAG} points at ${TAGGED}, not the merged commit ${{ github.event.pull_request.merge_commit_sha }}."
              exit 1
            fi
            echo "Tag ${TAG} already exists; continuing."
          else
            # verbatim: the default cleanup strips Markdown `#` headings.
            git tag -a "$TAG" --cleanup=verbatim -F "$BODY_FILE" "${{ github.event.pull_request.merge_commit_sha }}"
            git push origin "refs/tags/${TAG}"
            echo "Created and pushed ${TAG}"
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
          TAG: ${{ steps.notes.outputs.tag }}
          BODY_FILE: ${{ steps.notes.outputs.body }}
        run: |
          set -euo pipefail
          # Any SemVer prerelease (`-...`) is a prerelease release.
          PRERELEASE=()
          case "$VERSION" in
            *-*) PRERELEASE=(--prerelease) ;;
          esac

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; continuing."
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$BODY_FILE" "${PRERELEASE[@]}"
          fi
