name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The release checkers diff against the previous v* tag, so the clone
          # needs the tags and the history behind them, not a single commit.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all -- --check
      - name: sqlx offline cache freshness
        run: |
          set -o pipefail
          # sqlx-cli generates the .sqlx cache that the locked sqlx crate consumes; both
          # ship in one release, so install sqlx-cli at the sqlx crate version the
          # workspace resolves (cargo metadata); Cargo.lock has no sqlx-cli entry.
          SQLX_VERSION="$(cargo metadata --locked --format-version 1 \
            | jq -r '[.packages[] | select(.name == "sqlx")] | if length == 1 then .[0].version else error("expected exactly one resolved sqlx package") end')"
          cargo install sqlx-cli --version "=$SQLX_VERSION" --locked --no-default-features --features sqlite
          fixture_dir="$(mktemp -d)"
          trap 'rm -rf "$fixture_dir"' EXIT
          # Every migration, in order: a query against a table an appended
          # migration adds must be checked against the full embedded schema.
          for migration in crates/mindcore-sqlite/migrations/*.sql; do
            sqlite3 -bail "$fixture_dir/settlement.db" < "$migration"
          done
          SQLX_OFFLINE=false DATABASE_URL="sqlite://$fixture_dir/settlement.db" \
            cargo sqlx prepare --workspace -- --locked --workspace --all-targets
          cache_changes="$(git status --porcelain --untracked-files=all -- .sqlx/)"
          if [ -n "$cache_changes" ]; then
            echo "::error::.sqlx offline cache is stale — drifted entries:"
            printf '%s\n' "$cache_changes"
            git diff --stat -- .sqlx/
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          package-manager-cache: false
      # The API diff runs against the previous v* tag, so the tool is needed on every
      # branch once a tag exists — a prebuilt binary, not a from-source install.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: cargo-semver-checks
      - name: SemVer policy check
        run: node tooling/semver/check.mjs
      - name: Migration compatibility check
        run: node tooling/migrations/check.mjs
      - name: Test the release checkers
        run: node --test tooling/semver/check.test.mjs
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
        env:
          SQLX_OFFLINE: "true"
      - run: cargo test --locked --workspace
        env:
          SQLX_OFFLINE: "true"

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.18.1
          # The install line below is the only thing that decides the CLI version.
          package-manager-cache: false
      - name: Install corpus CLI
        run: npm install --global @mstar-harness/cli@4.8.3
      - name: Lint specs corpus
        run: mstar-harness lint .agents/specs --type specs
      - name: Lint ADR corpus
        run: mstar-harness lint .agents/adr --type adr
      # The release test renders a real tagged range; it skips without this binary.
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2
        with:
          tool: git-cliff@2
      - name: Test release tooling
        env:
          # Without the binary the git-cliff range test would skip; fail instead.
          REQUIRE_GIT_CLIFF: "1"
        run: node --test tooling/release/release.test.mjs
